# /etc/nginx/sites-available/changingworld
# Certbot ajoutera lui-même les blocs SSL et la redirection 80 → 443.

server {
    server_name changingworld.harari.ovh;

    # L'API Hono sert aussi l'admin construite (apps/admin/dist).
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Génération IA en streaming (Server-Sent Events) : pas de mise en tampon, délais longs.
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    client_max_body_size 10M;

    error_log  /var/log/nginx/changingworld_error.log;
    access_log /var/log/nginx/changingworld_access.log;

    listen 80;
}
