<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question sans indice</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..800,0..100,0..1&amp;family=Archivo:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body { margin: 0; font-family: Archivo, system-ui, sans-serif; }
a { color: #A8432C; } a:hover { color: #7C2E1C; }
</style>

</head>
<body>


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2ECE1; color: #1E1A15; display: flex; flex-direction: column; overflow: hidden; font-family: Archivo, system-ui, sans-serif">

  <!-- illustration de fond (placeholder) -->
  <div style="position: relative; height: 318px; flex: none; background: #A8432C; overflow: hidden">
    <div style="position: absolute; left: -90px; top: 40px; width: 420px; height: 420px; border: 1px solid rgba(251,247,239,0.22); border-radius: 50%"></div>
    <div style="position: absolute; left: -40px; top: 86px; width: 320px; height: 320px; border: 1px solid rgba(251,247,239,0.18); border-radius: 50%"></div>
    <div style="position: absolute; left: 10px; top: 132px; width: 220px; height: 220px; border: 1px solid rgba(251,247,239,0.14); border-radius: 50%"></div>
    <div style="position: absolute; right: -130px; top: -70px; width: 300px; height: 300px; border: 1px solid rgba(251,247,239,0.2); border-radius: 50%"></div>
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30,26,21,0.3) 0%, rgba(30,26,21,0) 38%, rgba(30,26,21,0.22) 100%)"></div>

    <div style="position: relative; height: 100%; box-sizing: border-box; padding: 22px 20px 16px; display: flex; flex-direction: column; justify-content: space-between">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.14em; color: #FBF7EF; line-height: 1.6">DÉMOGRAPHIE<br><span style="opacity: 0.8">› CROISSANCE DE LA POPULATION</span></div>
        <div style="text-align: right; flex: none">
          <div style="font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; color: #FBF7EF; line-height: 1">148</div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 0.14em; color: #FBF7EF; opacity: 0.8">POINTS</div>
        </div>
      </div>

      <div style="align-self: center; border: 1px dashed rgba(251,247,239,0.45); padding: 8px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #FBF7EF; opacity: 0.85">[ ILLUSTRATION — GRAVURE DE RECENSEMENT ]</div>

      <div style="display: flex; justify-content: space-between; align-items: flex-end">
        <span style="background: #F7EFDC; border: 1px solid #8A6516; color: #725310; font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.16em; padding: 5px 9px">SURPRENANT</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #FBF7EF; opacity: 0.85">12 / 40</span>
      </div>
    </div>
  </div>

  <!-- panneau papier -->
  <div style="flex: 1; min-height: 0; box-sizing: border-box; padding: 24px 20px 22px; display: flex; flex-direction: column; border-top: 2px solid #1E1A15">

    <h1 style="margin: 0 0 20px; font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 40, 'WONK' 1; font-size: 27px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em">À partir de l'an 1, combien de temps a-t-il fallu pour que la population mondiale triple&nbsp;?</h1>

    <div style="display: flex; flex-direction: column; gap: 9px">
      <button type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; box-sizing: border-box; background: #FBF7EF; border: 1.5px solid #C4B79E; border-radius: 2px; padding: 12px 14px; text-align: left; font: inherit; color: #1E1A15; cursor: pointer">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #6F6559; width: 13px; flex: none">A</span>
        <span style="font-size: 16px; font-weight: 500">600 ans</span>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; box-sizing: border-box; background: #FBF7EF; border: 1.5px solid #C4B79E; border-radius: 2px; padding: 12px 14px; text-align: left; font: inherit; color: #1E1A15; cursor: pointer">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #6F6559; width: 13px; flex: none">B</span>
        <span style="font-size: 16px; font-weight: 500">1200 ans</span>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; box-sizing: border-box; background: #FBF7EF; border: 1.5px solid #C4B79E; border-radius: 2px; padding: 12px 14px; text-align: left; font: inherit; color: #1E1A15; cursor: pointer">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #6F6559; width: 13px; flex: none">C</span>
        <span style="font-size: 16px; font-weight: 500">1800 ans</span>
      </button>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 14px">
      <button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 48px; box-sizing: border-box; background: transparent; border: 1.5px dashed #8A6516; border-radius: 2px; padding: 11px 14px; font: inherit; font-size: 14px; font-weight: 600; color: #725310; cursor: pointer">
        <span>Demander un indice</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; font-weight: 400">0 / 3</span>
      </button>

      <div style="border-top: 1px solid #C4B79E; padding-top: 12px; display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.14em; color: #6F6559">ENJEU ACTUEL</span>
        <span style="display: flex; align-items: baseline; gap: 12px">
          <span style="font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 600; color: #1D5B45; line-height: 1">+10</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #8A8075">/</span>
          <span style="font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 600; color: #A8432C; line-height: 1">−5</span>
        </span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
